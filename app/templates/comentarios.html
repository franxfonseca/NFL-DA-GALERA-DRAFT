<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Draft Night - Comentários das Rodadas</title>
<link rel="stylesheet" href="{{ url_for('static', filename='tema.css') }}">
<style>
    html, body { width: 100%; min-height: 100%; }
    body { padding: 3vh 3vw; }

    h1 {
        font-family: var(--fonte-placar);
        font-size: 2.4vw;
        text-align: center;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--tinta);
        margin-bottom: 2vh;
    }

    #estado-vazio {
        font-family: var(--fonte-corpo);
        text-align: center;
        margin-top: 15vh;
        font-size: 1.4vw;
        color: var(--tinta-suave);
    }

    #lista {
        display: flex;
        flex-direction: column;
        gap: 1vw;
        max-width: 60vw;
        margin: 0 auto;
    }

    .card-rodada {
        background: var(--cartao);
        border: 2px solid var(--tinta);
        border-radius: 8px;
        box-shadow: 4px 4px 0 var(--nfl-azul);
        margin: 0 0.3vw 0.3vw 0;
        padding: 1vw 1.4vw;
        display: flex;
        align-items: flex-start;
        gap: 1vw;
    }

    .card-rodada img {
        width: 3.2vw;
        height: 3.2vw;
        min-width: 44px;
        min-height: 44px;
        object-fit: cover;
        border-radius: 6px;
        border: 2px solid var(--tinta);
        flex-shrink: 0;
    }

    .card-rodada .conteudo { flex: 1; }

    .card-rodada .titulo {
        display: flex;
        align-items: center;
        gap: 0.6vw;
        margin-bottom: 0.4vw;
    }

    .card-rodada .titulo span.rotulo {
        font-family: var(--fonte-etiqueta);
        font-size: 0.85vw;
        font-weight: 700;
        color: var(--nfl-azul);
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    .card-rodada .texto {
        font-family: var(--fonte-corpo);
        font-size: 1vw;
        line-height: 1.45;
        color: var(--tinta);
    }

    .btn-ouvir {
        background: var(--papel);
        border: 2px solid var(--tinta);
        border-radius: 4px;
        width: 2vw;
        height: 2vw;
        min-width: 28px;
        min-height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1vw;
        flex-shrink: 0;
        color: var(--tinta);
    }
    .btn-ouvir:hover { background: var(--nfl-azul); color: var(--papel); }
    .btn-ouvir.falando { background: var(--nfl-azul); color: var(--papel); }

    .oculto { display: none; }
</style>
</head>
<body>
    <h1>Comentários do Tom Brady, por Rodada</h1>

    <div id="estado-vazio" class="oculto">Nenhuma rodada terminada ainda - o comentário sai assim que o último pick da rodada 1 acontecer.</div>
    <div id="lista"></div>

    <script src="{{ url_for('static', filename='narrador.js') }}"></script>
    <script>
        // toca o audio ElevenLabs pre-gerado (narrar(), de narrador.js), ou
        // cai pro TTS local automaticamente se nao existir/falhar
        let audioAtual = null;
        let botaoFalando = null;

        function falar(urlAudio, textoFallback, botao) {
            if (audioAtual) audioAtual.pause();
            speechSynthesis.cancel();
            if (botaoFalando) botaoFalando.classList.remove("falando");

            botao.classList.add("falando");
            botaoFalando = botao;
            audioAtual = narrar(urlAudio, textoFallback, () => botao.classList.remove("falando"));
        }

        function renderizar(estado) {
            // uma rodada aparece assim que o ultimo pick dela tiver comentario
            const comentarios = estado.picks
                .filter((p) => p.fim_de_rodada && p.comentario_rodada)
                .sort((a, b) => a.rodada - b.rodada);

            const vazio = document.getElementById("estado-vazio");
            const lista = document.getElementById("lista");

            if (!comentarios.length) {
                vazio.classList.remove("oculto");
                lista.innerHTML = "";
                return;
            }
            vazio.classList.add("oculto");

            lista.innerHTML = "";
            for (const pick of comentarios) {
                const card = document.createElement("div");
                card.className = "card-rodada";

                const img = document.createElement("img");
                img.src = "{{ url_for('static', filename='img/tom_brady.png') }}";
                img.alt = "Tom Brady";

                const conteudo = document.createElement("div");
                conteudo.className = "conteudo";

                const titulo = document.createElement("div");
                titulo.className = "titulo";

                const botao = document.createElement("button");
                botao.className = "btn-ouvir";
                botao.title = `Ouvir análise da rodada ${pick.rodada}`;
                botao.textContent = "🔊";
                botao.onclick = (evento) => falar(pick.audio_rodada, pick.comentario_rodada, evento.currentTarget);

                const rotulo = document.createElement("span");
                rotulo.className = "rotulo";
                rotulo.textContent = `RODADA ${pick.rodada}`;

                titulo.append(botao, rotulo);

                const texto = document.createElement("div");
                texto.className = "texto";
                texto.textContent = pick.comentario_rodada;

                conteudo.append(titulo, texto);
                card.append(img, conteudo);
                lista.appendChild(card);
            }
        }

        const fonte = new EventSource("/stream");
        fonte.onmessage = (evento) => {
            try {
                renderizar(JSON.parse(evento.data));
            } catch (erro) {
                console.error("falha ao processar estado:", erro);
            }
        };
    </script>
</body>
</html>
