<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Draft Night - Resultado</title>
<link rel="stylesheet" href="{{ url_for('static', filename='tema.css') }}">
<style>
    html, body { width: 100%; min-height: 100%; }
    body { padding: 3vh 3vw; }

    h1 {
        font-family: var(--fonte-placar);
        font-size: 2.4vw;
        text-align: center;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--tinta);
        margin-bottom: 2vh;
    }

    #estado-vazio, #estado-gerando {
        font-family: var(--fonte-corpo);
        text-align: center;
        margin-top: 15vh;
        font-size: 1.4vw;
        color: var(--tinta-suave);
    }

    #resumo-geral {
        max-width: 60vw;
        margin: 0 auto 4vh;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.8vw;
    }

    #resumo-geral p {
        font-family: var(--fonte-corpo);
        font-size: 1.15vw;
        color: var(--tinta-suave);
        line-height: 1.5;
    }

    #grade-times {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.6vw 1.4vw;
        max-width: 90vw;
        margin: 0 auto;
    }

    .card-time {
        background: var(--cartao);
        border: 2px solid var(--tinta);
        border-radius: 8px;
        box-shadow: 4px 4px 0 var(--cor-chip, var(--nfl-azul));
        padding: 1vw;
        display: flex;
        flex-direction: column;
        gap: 0.5vw;
        cursor: pointer;
        margin: 0 0.2vw 0.2vw 0;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .card-time:hover, .card-time.aberto {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--cor-chip, var(--nfl-azul));
    }

    .card-time .cabecalho {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .card-time .nome {
        font-family: var(--fonte-placar);
        font-size: 1.15vw;
        letter-spacing: 0.01em;
        text-transform: uppercase;
    }
    .card-time .dono {
        font-family: var(--fonte-etiqueta);
        font-size: 0.7vw;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--tinta-fraca);
    }
    .card-time .nota {
        font-family: var(--fonte-placar);
        font-size: 2vw;
    }

    .card-time .rodape {
        display: flex;
        align-items: flex-start;
        gap: 0.5vw;
    }

    .card-time .comentario {
        font-family: var(--fonte-corpo);
        font-size: 0.85vw;
        color: var(--tinta-suave);
        line-height: 1.4;
        flex: 1;
    }

    .nota-a { color: var(--verde); }
    .nota-b { color: #4c8a3f; }
    .nota-c { color: var(--ouro); }
    .nota-d { color: #b5651d; }
    .nota-f { color: var(--vermelho); }

    .btn-ouvir {
        background: var(--papel);
        border: 2px solid var(--tinta);
        border-radius: 4px;
        width: 2vw;
        height: 2vw;
        min-width: 28px;
        min-height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1vw;
        flex-shrink: 0;
        color: var(--tinta);
    }
    .btn-ouvir:hover { background: var(--nfl-azul); color: var(--papel); }
    .btn-ouvir.falando { background: var(--nfl-azul); color: var(--papel); }

    .brady-mini {
        width: 2vw;
        height: 2vw;
        min-width: 28px;
        min-height: 28px;
        border-radius: 4px;
        object-fit: cover;
        border: 2px solid var(--tinta);
        flex-shrink: 0;
    }

    .grupo-ouvir {
        display: flex;
        align-items: center;
        gap: 0.4vw;
        flex-shrink: 0;
    }

    .elenco {
        margin-top: 0.4vw;
        padding-top: 0.5vw;
        border-top: 1px solid var(--linha);
        display: none;
        flex-direction: column;
        gap: 0.25vw;
    }
    .card-time.aberto .elenco { display: flex; }

    .elenco .jogador {
        display: flex;
        justify-content: space-between;
        font-family: var(--fonte-etiqueta);
        font-size: 0.72vw;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--tinta-suave);
    }
    .elenco .jogador .pos { color: var(--tinta-fraca); text-transform: uppercase; }

    .oculto { display: none; }
</style>
</head>
<body>
    <h1>Análise Final do Draft</h1>

    <div id="estado-vazio" class="oculto">O draft ainda não foi finalizado. Vá em /control e clique em "Finalizar draft".</div>
    <div id="estado-gerando" class="oculto">Gerando análise final, um momento...</div>

    <div id="conteudo" class="oculto">
        <div id="resumo-geral">
            <div class="grupo-ouvir">
                <img class="brady-mini" src="{{ url_for('static', filename='img/tom_brady.png') }}" alt="Tom Brady">
                <button class="btn-ouvir" id="btn-ouvir-resumo" title="Ouvir resumo geral">🔊</button>
            </div>
            <p id="resumo-geral-texto"></p>
        </div>
        <div id="grade-times"></div>
    </div>

    <script src="{{ url_for('static', filename='narrador.js') }}"></script>
    <script>
        // fala so quando o operador clica no icone - nunca sozinho.
        // narrar() (de narrador.js) toca o audio ElevenLabs pre-gerado, ou
        // cai pro TTS local automaticamente se nao existir/falhar.
        let audioAtual = null;
        let botaoFalando = null;

        function falar(urlAudio, textoFallback, botao) {
            if (audioAtual) audioAtual.pause();
            speechSynthesis.cancel();
            if (botaoFalando) botaoFalando.classList.remove("falando");

            botao.classList.add("falando");
            botaoFalando = botao;
            audioAtual = narrar(urlAudio, textoFallback, () => botao.classList.remove("falando"));
        }

        function corDaNota(nota) {
            const letra = (nota || "").trim().charAt(0).toUpperCase();
            return { A: "nota-a", B: "nota-b", C: "nota-c", D: "nota-d", F: "nota-f" }[letra] || "";
        }

        function montarGrade(estado) {
            const analise = estado.analise_final;

            document.getElementById("resumo-geral-texto").textContent = analise.resumo_geral || "";
            document.getElementById("btn-ouvir-resumo").onclick = (evento) => {
                falar(analise.audio_resumo, analise.resumo_geral || "", evento.currentTarget);
            };

            const grade = document.getElementById("grade-times");
            grade.innerHTML = "";
            const times = analise.times || {};
            const slots = Object.keys(times).sort((a, b) => Number(a) - Number(b));

            for (const slot of slots) {
                const dados = times[slot];
                const infoTime = (estado.times || {})[slot] || {};
                const nomeTime = infoTime.nome_time || `Time ${slot}`;

                const card = document.createElement("div");
                card.className = "card-time";
                // mesma cor do cabecalho do time no board (/control) - a
                // sombra dura do card puxa pra a identidade do time. So
                // seta a variavel se existir - setProperty com null vira a
                // string "null" e quebra o fallback var(--cor-chip, ...)
                if (infoTime.cor_cabecalho) {
                    card.style.setProperty("--cor-chip", infoTime.cor_cabecalho);
                }

                const cabecalho = document.createElement("div");
                cabecalho.className = "cabecalho";
                const nomeWrap = document.createElement("div");
                const nome = document.createElement("div");
                nome.className = "nome";
                nome.textContent = nomeTime;
                const dono = document.createElement("div");
                dono.className = "dono";
                dono.textContent = infoTime.dono || "";
                nomeWrap.append(nome, dono);

                const nota = document.createElement("div");
                nota.className = `nota ${corDaNota(dados.nota)}`;
                nota.textContent = dados.nota || "?";
                cabecalho.append(nomeWrap, nota);

                const rodape = document.createElement("div");
                rodape.className = "rodape";

                const grupoOuvir = document.createElement("div");
                grupoOuvir.className = "grupo-ouvir";

                const foto = document.createElement("img");
                foto.className = "brady-mini";
                foto.src = "{{ url_for('static', filename='img/tom_brady.png') }}";
                foto.alt = "Tom Brady";

                const botao = document.createElement("button");
                botao.className = "btn-ouvir";
                botao.title = `Ouvir sobre ${nomeTime}`;
                botao.textContent = "🔊";
                botao.onclick = (evento) => {
                    evento.stopPropagation(); // nao expande/colapsa o elenco ao clicar em ouvir
                    falar(dados.audio, `${nomeTime}, nota ${dados.nota}. ${dados.comentario || ""}`, evento.currentTarget);
                };

                grupoOuvir.append(foto, botao);

                const comentario = document.createElement("div");
                comentario.className = "comentario";
                comentario.textContent = dados.comentario || "";

                rodape.append(grupoOuvir, comentario);

                // elenco do time - jogador e posicao, na ordem que foram draftados
                const picksDoTime = (estado.picks || [])
                    .filter((p) => String(p.slot) === slot)
                    .sort((a, b) => a.pick - b.pick);

                const elenco = document.createElement("div");
                elenco.className = "elenco";
                for (const p of picksDoTime) {
                    const linha = document.createElement("div");
                    linha.className = "jogador";
                    const nomeJogador = document.createElement("span");
                    nomeJogador.textContent = `R${p.rodada} - ${p.nome}`;
                    const pos = document.createElement("span");
                    pos.className = "pos";
                    pos.textContent = `${p.posicao} - ${p.time_nfl}`;
                    linha.append(nomeJogador, pos);
                    elenco.appendChild(linha);
                }

                card.addEventListener("click", () => card.classList.toggle("aberto"));

                card.append(cabecalho, rodape, elenco);
                grade.appendChild(card);
            }
        }

        function renderizar(estado) {
            const vazio = document.getElementById("estado-vazio");
            const gerando = document.getElementById("estado-gerando");
            const conteudo = document.getElementById("conteudo");

            if (estado.gerando_analise_final) {
                vazio.classList.add("oculto");
                gerando.classList.remove("oculto");
                conteudo.classList.add("oculto");
                return;
            }

            if (!estado.analise_final) {
                vazio.classList.remove("oculto");
                gerando.classList.add("oculto");
                conteudo.classList.add("oculto");
                return;
            }

            vazio.classList.add("oculto");
            gerando.classList.add("oculto");
            conteudo.classList.remove("oculto");

            montarGrade(estado);
        }

        const fonte = new EventSource("/stream");
        fonte.onmessage = (evento) => {
            try {
                renderizar(JSON.parse(evento.data));
            } catch (erro) {
                console.error("falha ao processar estado:", erro);
            }
        };
    </script>
</body>
</html>
