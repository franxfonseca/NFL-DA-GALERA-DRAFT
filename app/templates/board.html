<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Draft Night</title>
<link rel="stylesheet" href="{{ url_for('static', filename='board.css') }}">
</head>
<body>
    <div id="board">
        {% for slot in range(1, num_times + 1) %}
        <div class="coluna" data-slot="{{ slot }}">
            <div class="coluna-cabecalho">Time {{ slot }}</div>
            <div class="coluna-picks"></div>
        </div>
        {% endfor %}
    </div>

    <script src="{{ url_for('static', filename='board.js') }}"></script>
</body>
</html>
