<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Draft Night</title>
<link rel="stylesheet" href="{{ url_for('static', filename='board.css') }}">
</head>
<body>
    <div id="board">
        {% for slot in range(1, num_times + 1) %}
        <div class="coluna" data-slot="{{ slot }}">
            <div class="coluna-cabecalho">
                <div class="nome-time">Time {{ slot }}</div>
                <div class="nome-dono"></div>
            </div>
            <div class="coluna-picks"></div>
        </div>
        {% endfor %}
    </div>

    <div id="revelacao">
        <div class="revelacao-caixa">
            <div class="revelacao-anuncio">ESCOLHA Nº <span id="rev-pick"></span></div>
            <img id="rev-foto" alt="">
            <div id="rev-nome" class="revelacao-nome"></div>
            <div id="rev-info" class="revelacao-info"></div>
            <div id="rev-veredito" class="revelacao-veredito"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='board.js') }}"></script>
</body>
</html>
