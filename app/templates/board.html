<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Draft Night</title>
<link rel="stylesheet" href="{{ url_for('static', filename='board.css') }}">
</head>
<body>
    <div id="board">
        <div class="coluna coluna-rodadas">
            <div class="coluna-cabecalho">
                <div class="nome-time">RODADAS</div>
                <button id="btn-mutar" title="Mutar narração">🔊</button>
            </div>
            <div class="coluna-picks">
                {% for rodada in range(1, 17) %}
                <div class="rodada-label">RD {{ rodada }}</div>
                {% endfor %}
            </div>
        </div>
        {% for slot in range(1, num_times + 1) %}
        <div class="coluna" data-slot="{{ slot }}">
            <div class="coluna-cabecalho">
                <div class="nome-time">Time {{ slot }}</div>
                <div class="nome-dono"></div>
            </div>
            <div class="coluna-picks"></div>
        </div>
        {% endfor %}
    </div>

    <div id="desbloquear">
        <div class="desbloquear-caixa">
            <label for="select-voz">Voz da narração</label>
            <select id="select-voz"></select>
            <button id="btn-desbloquear">🔊 Clique pra iniciar o board</button>
        </div>
    </div>

    <div id="revelacao">
        <div class="revelacao-caixa">
            <div class="revelacao-anuncio">ESCOLHA Nº <span id="rev-pick"></span></div>
            <img id="rev-foto" alt="">
            <div id="rev-nome" class="revelacao-nome"></div>
            <div id="rev-info" class="revelacao-info"></div>
            <div id="rev-veredito" class="revelacao-veredito"></div>
        </div>
    </div>

    <div id="comentarista">
        <img src="{{ url_for('static', filename='img/tom_brady.png') }}" alt="Comentarista">
        <div class="balao">
            <div class="balao-titulo">Análise da rodada <span id="comentarista-rodada"></span></div>
            <div id="comentarista-texto" class="balao-texto"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='board.js') }}"></script>
</body>
</html>
