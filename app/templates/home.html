<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Draft Night</title>
<link rel="stylesheet" href="{{ url_for('static', filename='tema.css') }}">
<style>
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2vh;
        text-align: center;
        padding: 0 8vw;
    }

    img {
        width: 13vw;
        height: 13vw;
        min-width: 130px;
        min-height: 130px;
        object-fit: cover;
        border-radius: 8px;
        border: 4px solid var(--tinta);
        box-shadow: 6px 6px 0 var(--nfl-azul);
    }

    h1 {
        font-family: var(--fonte-placar);
        font-size: 3vw;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--tinta);
        margin-top: 1vh;
    }

    .fala {
        display: flex;
        align-items: center;
        gap: 1vw;
        max-width: 55vw;
    }

    .fala p {
        font-family: var(--fonte-corpo);
        font-size: 1.25vw;
        line-height: 1.5;
        color: var(--tinta-suave);
    }

    .btn-ouvir {
        background: var(--cartao);
        border: 2px solid var(--tinta);
        border-radius: 6px;
        box-shadow: 3px 3px 0 var(--tinta);
        width: 2.6vw;
        height: 2.6vw;
        min-width: 36px;
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.2vw;
        flex-shrink: 0;
        color: var(--tinta);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-ouvir:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--tinta); }
    .btn-ouvir.falando { background: var(--nfl-azul); color: var(--papel); border-color: var(--tinta); }

    #btn-board {
        margin-top: 2vh;
        font-family: var(--fonte-placar);
        font-size: 1.4vw;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        padding: 0.9vw 2.4vw;
        text-decoration: none;
    }
</style>
</head>
<body>
    <img src="{{ url_for('static', filename='img/tom_brady.png') }}" alt="Tom Brady">
    <h1>Draft Night</h1>

    <div class="fala">
        <button class="btn-ouvir" id="btn-ouvir" title="Ouvir">🔊</button>
        <p id="texto-boas-vindas"></p>
    </div>

    <a id="btn-board" class="dn-botao" href="/board">Entrar no Board</a>

    <script src="{{ url_for('static', filename='narrador.js') }}"></script>
    <script>
        // a mensagem vem do servidor - pausas sao so pontuacao (sem tags),
        // mas mantem essa limpeza como garantia caso alguma tag escape
        const MENSAGEM_CRUA = {{ mensagem_boas_vindas | tojson }};
        const MENSAGEM_LIMPA = MENSAGEM_CRUA.replace(/<break[^>]*\/?>/g, " ").replace(/\s+/g, " ").trim();

        document.getElementById("texto-boas-vindas").textContent = MENSAGEM_LIMPA;

        document.getElementById("btn-ouvir").addEventListener("click", (evento) => {
            const botao = evento.currentTarget;
            botao.classList.add("falando");
            narrar("/audio/boas-vindas.mp3", MENSAGEM_LIMPA, () => botao.classList.remove("falando"));
        });
    </script>
</body>
</html>
